[project]
name = "quality-checker"
version = "0.1.0"
description = "SOM and eDCT Excel quality checker with validation history and PyQt desktop app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "PyQt6>=6.7.1",
]

[project.scripts]
quality-checker = "quality_checker.gui.app:run_app"
quality-checker-smoke = "quality_checker.smoke:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_checker"]

[tool.coverage.run]
branch = true
source = ["quality_checker"]

[tool.coverage.report]
fail_under = 100
show_missing = true

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]
