[project]
name = "quality-checker-workspace"
version = "0.1.0"
description = "Desktop quality checker for SOM and eDCT workbooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "PyQt6>=6.7.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["som_analyzer.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"quality_checker/tests/**/*.py" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
